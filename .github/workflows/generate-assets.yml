name: Generate gallery assets

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "scripts/generate_assets.py"
      - ".github/workflows/generate-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate thumbnails and OGP
        run: python scripts/generate_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs assets/ogp.jpg data/gallery.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate optimized gallery assets"
          git push
